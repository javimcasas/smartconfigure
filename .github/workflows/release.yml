name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Windows + Linux are cross-compiled from a single Ubuntu runner using
  # fyne-cross, which runs the actual build inside Docker images that
  # already bundle the right C toolchains (mingw for Windows, native gcc
  # for Linux). This avoids needing separate native runners for those two.
  build-windows-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tidy modules
        run: go mod tidy

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows binary
        run: fyne-cross windows -arch=amd64 -app-id com.javimcasas.smartconfigure -output smartconfigure

      - name: Build Linux binary
        run: fyne-cross linux -arch=amd64 -app-id com.javimcasas.smartconfigure -output smartconfigure

      - name: List fyne-cross output
        run: find fyne-cross/dist -type f

      # fyne-cross packages Windows as a .zip (containing the .exe) and
      # Linux as a .tar.xz — neither includes a platform suffix in its
      # name, so we add one here for clean, unambiguous release assets.
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find fyne-cross/dist -iname '*.zip' -exec cp {} dist/smartconfigure-windows-amd64.zip \;
          find fyne-cross/dist -iname '*.tar.xz' -exec cp {} dist/smartconfigure-linux-amd64.tar.xz \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: smartconfigure-windows-linux
          path: dist/*

  # macOS is built natively on a real macOS runner: Fyne needs cgo, and
  # cross-compiling *to* darwin from Linux requires extracting Apple's SDK
  # from Xcode manually (a licensing/automation headache), while building
  # natively on macOS needs no extra setup at all.
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tidy modules
        run: go mod tidy

      - name: Build binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/smartconfigure-darwin-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: smartconfigure-darwin-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [build-windows-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
